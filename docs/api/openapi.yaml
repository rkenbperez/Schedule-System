components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - generate
      - publish
      - import
      - export
      - bulk_create
      - bulk_update
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `generate` - Generate Schedule
        * `publish` - Publish Schedule
        * `import` - Import Data
        * `export` - Export Data
        * `bulk_create` - Bulk Create
        * `bulk_update` - Bulk Update
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        prof:
          type: integer
        subject:
          type: integer
        section:
          type: integer
        term:
          type: integer
          readOnly: true
          nullable: true
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/MeetingSlot'
        prof_name:
          type: string
          readOnly: true
        subject_label:
          type: string
          readOnly: true
        section_name:
          type: string
          readOnly: true
      required:
      - id
      - meetings
      - prof
      - prof_name
      - section
      - section_name
      - subject
      - subject_label
      - term
    AssignmentInput:
      type: object
      properties:
        prof:
          type: integer
        subject:
          type: integer
        section:
          type: integer
        term:
          type: integer
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/MeetingInput'
      required:
      - prof
      - section
      - subject
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        model_name:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        object_repr:
          type: string
          readOnly: true
        changes:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - changes
      - id
      - ip_address
      - model_name
      - object_id
      - object_repr
      - timestamp
      - user
      - user_agent
      - user_name
    AvailabilityWindow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        prof:
          type: integer
        day:
          allOf:
          - $ref: '#/components/schemas/DayEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        day_display:
          type: string
          readOnly: true
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        is_preferred:
          type: boolean
      required:
      - day
      - day_display
      - end_time
      - id
      - prof
      - start_time
    BlankEnum:
      enum:
      - ''
    BulkCreateAssignmentsRequest:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInput'
      required:
      - assignments
    BulkCreateSectionsRequest:
      type: object
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionInput'
      required:
      - sections
    BusyBlock:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        prof:
          type: integer
        day:
          allOf:
          - $ref: '#/components/schemas/DayEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        day_display:
          type: string
          readOnly: true
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - day
      - day_display
      - end_time
      - id
      - prof
      - start_time
    ConflictResolution:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        run:
          type: integer
          readOnly: true
        run_id:
          type: integer
          readOnly: true
        run_algorithm:
          type: string
          readOnly: true
        conflict_type:
          type: string
          maxLength: 50
        conflict_details: {}
        resolution_type:
          oneOf:
          - $ref: '#/components/schemas/ResolutionTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        resolution_details: {}
        status:
          $ref: '#/components/schemas/ConflictResolutionStatusEnum'
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
        resolved_by_name:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - conflict_details
      - conflict_type
      - created_at
      - id
      - resolved_at
      - resolved_by
      - resolved_by_name
      - run
      - run_algorithm
      - run_id
    ConflictResolutionResolve:
      type: object
      properties:
        resolution_type:
          $ref: '#/components/schemas/ResolutionTypeEnum'
        resolution_details: {}
      required:
      - resolution_type
    ConflictResolutionStatusEnum:
      enum:
      - pending
      - resolved
      - ignored
      type: string
      description: |-
        * `pending` - Pending
        * `resolved` - Resolved
        * `ignored` - Ignored
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_staff:
          type: boolean
        role:
          type: string
        professor:
