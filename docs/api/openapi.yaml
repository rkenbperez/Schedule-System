      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/assignments/bulk/:
    post:
      operationId: admin_assignments_bulk_create
      description: Bulk create assignments with meetings.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateAssignmentsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkCreateAssignmentsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkCreateAssignmentsRequest'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '201':
          description: Assignments created
        '400':
          description: Validation errors
  /api/admin/conflict-resolutions/{id}/ignore/:
    post:
      operationId: admin_conflict_resolutions_ignore_create
      description: Ignore a conflict.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conflicts
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Conflict ignored
        '404':
          description: Conflict not found
  /api/admin/conflict-resolutions/{id}/resolve/:
    post:
      operationId: admin_conflict_resolutions_resolve_create
      description: Resolve a conflict.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conflicts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolutionResolve'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConflictResolutionResolve'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConflictResolutionResolve'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResolution'
          description: ''
        '404':
          description: Conflict not found
  /api/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
