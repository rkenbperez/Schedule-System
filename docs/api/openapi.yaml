  /api/auth/jwt/login/:
    post:
      operationId: auth_jwt_login_create
      description: Returns access + refresh tokens. Use access token as 'Bearer <token>'
        in Authorization header.
      summary: Obtain JWT token pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWTTokenPair'
          description: ''
        '401':
          description: Invalid credentials
  /api/auth/jwt/logout/:
    post:
      operationId: auth_jwt_logout_create
      description: Blacklist refresh token (logout).
      summary: Logout - blacklist refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
