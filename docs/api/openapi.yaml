openapi: 3.0.3
info:
  title: Schedule API
  version: 1.0.0
  description: API documentation for Schedule project
paths:
  /api/admin/analytics/overview/:
    get:
      operationId: admin_analytics_overview_retrieve
      parameters:
      - in: query
        name: run
        schema:
          type: integer
        description: Schedule run ID. Defaults to latest published, then latest feasible.
      - in: query
        name: term
        schema:
          type: string
        description: Term ID or YYYY-S code. Defaults to the active term.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/analytics/quality/:
    get:
      operationId: admin_analytics_quality_retrieve
      parameters:
      - in: query
        name: algorithm
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: Run date lower bound, YYYY-MM-DD.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, 1-200. Default 50.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset.
      - in: query
        name: run
        schema:
          type: integer
        description: Schedule run ID. Defaults to latest published, then latest feasible.
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: term
        schema:
          type: string
        description: Term ID or YYYY-S code. Defaults to the active term.
      - in: query
        name: to
        schema:
          type: string
        description: Run date upper bound, YYYY-MM-DD.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/analytics/rooms/:
    get:
      operationId: admin_analytics_rooms_retrieve
      parameters:
      - in: query
        name: building
        schema:
          type: string
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, 1-200. Default 50.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset.
      - in: query
        name: run
        schema:
          type: integer
        description: Schedule run ID. Defaults to latest published, then latest feasible.
      - in: query
        name: term
        schema:
          type: string
        description: Term ID or YYYY-S code. Defaults to the active term.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/analytics/sections/:
    get:
      operationId: admin_analytics_sections_retrieve
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, 1-200. Default 50.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset.
      - in: query
        name: program
        schema:
          type: string
      - in: query
        name: run
        schema:
          type: integer
        description: Schedule run ID. Defaults to latest published, then latest feasible.
      - in: query
        name: term
        schema:
          type: string
        description: Term ID or YYYY-S code. Defaults to the active term.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/admin/analytics/workload/:
