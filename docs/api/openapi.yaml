      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPublishScheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPublishScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPublishScheduleRequest'
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Schedule publish status updated
        '404':
          description: Schedule run not found
  /api/admin/schedules/runs/{run_id}/conflict-resolutions/:
    get:
      operationId: admin_schedules_runs_conflict_resolutions_list
      description: List conflict resolutions for a schedule run.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: run_id
        schema:
          type: integer
        required: true
      tags:
      - conflicts
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConflictResolutionList'
          description: ''
